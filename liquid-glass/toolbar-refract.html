<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass — edge refraction</title>
<style>
  html,body{margin:0;height:100%;background:#050505;display:grid;place-items:center;
    font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;}
  .wrap{text-align:center}
  canvas{max-width:96vw;height:auto;border-radius:14px;cursor:grab;touch-action:none;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  canvas:active{cursor:grabbing}
  .hint{color:#5a5a62;font-size:13px;margin-top:14px;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="900" height="440"></canvas>
    <div class="hint">drag the glass bar &middot; it refracts whatever passes under the rim</div>
  </div>

  <script src="glass.js"></script>
  <script>
  const W = 900, H = 440;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---- background scene (drawn once) ----
  const bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const b = bgCanvas.getContext('2d');
  function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
  function drawScene(){
    b.fillStyle='#050505'; b.fillRect(0,0,W,H);
    // green card
    const g=b.createLinearGradient(0,150,0,H); g.addColorStop(0,'#6cbd4f'); g.addColorStop(1,'#2c6b27');
    b.fillStyle=g; roundRect(b,40,170,820,500,80); b.fill();
    b.fillStyle='rgba(255,255,255,.10)'; roundRect(b,40,170,820,300,80); b.fill();
    // wordmark + chips (stuff to refract)
    b.fillStyle='#15151a'; b.font='800 60px -apple-system,system-ui,sans-serif'; b.textBaseline='middle';
    b.fillText('Liquid glass', 250, 150);
    const chips=['#2262ff','#18c8b4','#9a5aff','#ff5a78','#46d25a','#ffcc33'];
    chips.forEach((c,i)=>{b.fillStyle=c;roundRect(b,150+i*110,232,40,40,12);b.fill();});
  }
  drawScene();
  const bgData = b.getImageData(0,0,W,H).data;

  // ---- one-time blur for the frost ----
  function boxBlur(src,radius,passes){
    let cur=Float64Array.from(src);
    const idx=(x,y)=>(y*W+x)*4, cl=(v,a,z)=>v<a?a:v>z?z:v;
    for(let p=0;p<passes;p++){const tmp=new Float64Array(cur.length),o=new Float64Array(cur.length);
      for(let y=0;y<H;y++)for(let c=0;c<4;c++){let acc=0;const n=radius*2+1;for(let x=-radius;x<=radius;x++)acc+=cur[idx(cl(x,0,W-1),y)+c];
        for(let x=0;x<W;x++){tmp[idx(x,y)+c]=acc/n;acc+=cur[idx(cl(x+radius+1,0,W-1),y)+c]-cur[idx(cl(x-radius,0,W-1),y)+c];}}
      for(let x=0;x<W;x++)for(let c=0;c<4;c++){let acc=0;const n=radius*2+1;for(let y=-radius;y<=radius;y++)acc+=tmp[idx(x,cl(y,0,H-1))+c];
        for(let y=0;y<H;y++){o[idx(x,y)+c]=acc/n;acc+=tmp[idx(x,cl(y+radius+1,0,H-1))+c]-tmp[idx(x,cl(y-radius,0,H-1))+c];}}cur=o;}
    const out=new Uint8ClampedArray(cur.length); for(let i=0;i<cur.length;i++)out[i]=cur[i]; return out;
  }
  const blurred = boxBlur(bgData, 26, 3);

  // ---- glass state ----
  const cap = {cx:450, cy:196, w:436, h:132, r:66};
  const outImg = ctx.createImageData(W,H);
  const tmp = document.createElement('canvas'); tmp.width=W; tmp.height=H; const tctx=tmp.getContext('2d');

  function drawIcons(cx,cy){
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.lineJoin='round';
    const X=[cx-132,cx,cx+132];
    // add
    roundRect(ctx,X[0]-26,cy-21,52,42,11); ctx.stroke();
    ctx.beginPath();ctx.moveTo(X[0]-11,cy);ctx.lineTo(X[0]+11,cy);ctx.moveTo(X[0],cy-11);ctx.lineTo(X[0],cy+11);ctx.stroke();
    // bookmark
    ctx.beginPath();ctx.moveTo(X[1]-17,cy-24);ctx.lineTo(X[1]+17,cy-24);ctx.lineTo(X[1]+17,cy+24);
    ctx.lineTo(X[1],cy+11);ctx.lineTo(X[1]-17,cy+24);ctx.closePath();ctx.stroke();
    // more
    for(const dx of [-16,0,16]){ctx.beginPath();ctx.arc(X[2]+dx,cy,3.1,0,7);ctx.fill();}
    ctx.restore();
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bgCanvas,0,0);
    // drop shadow
    ctx.save(); ctx.filter='blur(12px)'; ctx.fillStyle='rgba(0,0,0,.32)';
    roundRect(ctx,cap.cx-cap.w/2,cap.cy-cap.h/2+12,cap.w,cap.h,cap.r); ctx.fill(); ctx.restore();
    // refraction
    outImg.data.fill(0);
    LiquidGlass.render(bgData, blurred, outImg.data, W, H, cap, { frost: 0.58 });
    tctx.putImageData(outImg,0,0);
    ctx.drawImage(tmp,0,0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- drag ----
  let drag=null;
  function local(e){const r=canvas.getBoundingClientRect();return [ (e.clientX-r.left)*(W/r.width), (e.clientY-r.top)*(H/r.height) ];}
  canvas.addEventListener('pointerdown',e=>{const [x,y]=local(e);
    if(LiquidGlass.rrSDF(x,y,cap.cx,cap.cy,cap.w,cap.h,cap.r)<=2){drag={ox:x-cap.cx,oy:y-cap.cy};canvas.setPointerCapture(e.pointerId);}});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=local(e);
    cap.cx=Math.max(cap.w/2,Math.min(W-cap.w/2,x-drag.ox)); cap.cy=Math.max(cap.h/2,Math.min(H-cap.h/2,y-drag.oy));});
  canvas.addEventListener('pointerup',()=>drag=null);
  </script>
</body>
</html>
